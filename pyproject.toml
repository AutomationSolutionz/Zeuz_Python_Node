[project]
name = "zeuz-python-node"
version = "20.1.0"
description = "A cross-platform automation tool + framework that can automate web, mobile, desktop, rest api & databases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "appium-python-client>=4.2.1",
    "appscript>=1.3.0 ; sys_platform == 'darwin'",
    "attrs>=25.1.0",
    "beautifulsoup4>=4.13.3",
    "clint>=0.5.1 ; sys_platform == 'win32'",
    "colorama>=0.4.6",
    "configobj>=5.0.9",
    "datefinder>=0.7.3",
    "deepdiff>=8.2.0",
    "fastapi[standard]>=0.115.8",
    "genson>=1.3.0",
    "google-cloud-bigquery>=3.29.0",
    "google-cloud-bigquery-storage>=2.28.0",
    "google-cloud-storage>=3.0.0",
    "html-diff>=0.4.1",
    "idna>=3.10",
    "image>=1.5.33",
    "imap-tools>=1.10.0",
    "imutils>=0.5.4",
    "jinja2>=3.1.5",
    "jsonpointer>=3.0.0",
    "jsonschema>=4.23.0",
    "keyboard>=0.13.5",
    "lxml>=5.3.1",
    "mitmproxy>=0.14.0",
    "mouse>=0.7.1",
    "notify-py>=0.3.43",
    "opencv-python>=4.11.0.86",
    "openpyxl>=3.1.5 ; sys_platform == 'win32'",
    "pandas>=2.2.3",
    "pdf2image>=1.17.0 ; sys_platform == 'win32'",
    "pillow>=11.1.0",
    "pip>=25.0.1",
    "plyer>=2.1.0",
    "premailer>=3.10.0",
    "psutil>=7.0.0",
    "pyautocad>=0.2.0",
    "pyautogui>=0.9.54",
    "pyautoit>=0.6.5 ; sys_platform == 'win32'",
    "pydantic>=2.10.6",
    "pygetwindow",
    "pypdf2>=3.0.1",
    "pyperclip>=1.9.0",
    "pyobjc-core>=11.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=11.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=11.0 ; sys_platform == 'darwin'",
    "pyrsistent>=0.20.0",
    "pyscreenshot>=3.1",
    "pyserial>=3.5",
    "pyshortcuts>=1.9.5",
    "pytesseract>=0.3.13 ; sys_platform == 'win32'",
    "pytest>=8.3.4",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.1",
    "pythonnet>=3.0.5 ; sys_platform == 'win32'",
    "pyttsx3>=2.98",
    "pyttsx3>=2.98 ; sys_platform == 'win32'",
    "pytz>=2025.1",
    "pywin32>=308 ; sys_platform == 'win32'",
    "pyyaml>=6.0.2",
    "playwright>=1.52.0",
    "rauth>=0.7.3",
    "regex>=2024.11.6",
    "requests>=2.32.3",
    "rfc3339-validator>=0.1.4",
    "rfc3986-validator>=0.1.1",
    "rich>=13.9.4",
    "selenium>=4.21.0",
    "setuptools>=75.8.0 ; sys_platform == 'win32'",
    "simplejson>=3.20.1",
    "speechrecognition>=3.14.1 ; sys_platform == 'win32'",
    "thefuzz>=0.22.1",
    "tqdm>=4.67.1",
    "tzlocal>=5.3",
    "uiautomator>=1.0.2",
    "urllib3>=2.3.0",
    "uv>=0.6.2",
    "uvicorn>=0.34.0",
    "webcolors>=24.11.1",
    "webdriver-manager>=4.0.2",
    "websocket-client==1.3.3",
    "wheel>=0.45.1",
    "winshell>=0.6 ; sys_platform == 'win32'",
    "wmi>=1.5.1 ; sys_platform == 'win32'",
    "xlwings>=0.33.9",
    "xmltodict>=0.14.2",
    "xvfbwrapper>=0.2.9 ; sys_platform == 'linux'",
    "pyodbc>=5.2.0",
    "psycopg2-binary>=2.9.10",
    "cryptography==42.0.8",
    "pipdeptree>=2.26.1",
    "axe-selenium-python>=2.1.6",
    "filelock>=3.20.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.7",
    "types-colorama>=0.4.15.20240311",
    "types-psutil>=7.0.0.20250218",
    "types-pytz>=2025.1.0.20250204",
    "types-requests>=2.32.0.20241016",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-html>=3.1.0",
    "pytest-xdist>=3.0.0",
    "coverage>=7.0.0",
]

[tool.uv.sources]
pygetwindow = { url = "https://github.com/AutomationSolutionz/PyGetWindow-0.0.5/archive/master.zip" }

[tool.uv]
index-strategy = "unsafe-best-match"
allow-insecure-host = [
    "pypi.org",
    "pypi.python.org",
    "files.pythonhosted.org",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
