name: Go

on:
  push:
    # branches: [ dev ]
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23

    - name: Build
      working-directory: ./Apps/node_runner
      run: make all

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: ./Apps/node_runner/build/*
