name: Node Runner

on:
  push:
    branches: [ '*' ]
    tags: [ 'v*' ]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            artifact: node-runner-linux
            make_args: linux
          - runner: macos-latest
            target: mac
            artifact: node-runner-macos
            make_args: mac
          - runner: windows-latest
            target: windows
            artifact: node-runner-windows
            make_args: "WINDRES=windres windows"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Install Windows build tools
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install make --no-progress -y
          choco install mingw --no-progress -y
          echo 'C:\ProgramData\chocolatey\lib\make\tools\install\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo 'C:\tools\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Version.txt
        run: |
          PYTHON=$(command -v python3 || command -v python)
          "$PYTHON" <<'PY'
          import datetime
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("Framework/Version.txt")
          text = path.read_text()
          text = re.sub(r"^version = .*$", f"version = {version}", text, flags=re.MULTILINE)
          text = re.sub(
              r"^date = .*$",
              "date = " + datetime.datetime.utcnow().strftime("%b %d, %Y"),
              text,
              flags=re.MULTILINE,
          )
          path.write_text(text)
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build ${{ matrix.target }} binaries
        working-directory: Apps/node_runner
        run: make ${{ matrix.make_args }}
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Apps/node_runner/build/*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: Apps/node_runner/build

      - name: Consolidate artifacts
        run: |
          shopt -s nullglob
          for dir in Apps/node_runner/build/*; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                mv "$file" Apps/node_runner/build/
              done
              rmdir "$dir"
            fi
          done

      - name: Generate checksums
        run: |
          cd Apps/node_runner/build
          sha256sum * > checksums.txt

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: Apps/node_runner/build/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: Apps/node_runner/build/*
          generate_release_notes: true
